id: heraklion_1941
title: "Heraklion airfield, Crete, 20-22 May 1941"
family: airhead
description: >
  Within-campaign control for Maleme. Fallschirmjaeger-Regiment 1 dropped on
  Heraklion airfield from about 16:00 on 20 May, in staggered waves and
  without direct air support, onto a strong, alert British, Australian and
  Greek garrison (14th Infantry Brigade). The Germans never took the
  airfield. Sourced from search excerpts only (Wikipedia, Warfare History
  Network): most values are flagged assumptions.
clock:
  h_hour_local: 17.0        # first troop-carriers at 17:00 (Long); drops at intervals for two hours
  dt_h: 0.25
  horizon_h: 48

sources:
  LONG13:
    cite: "Gavin Long, 'Greece, Crete and Syria', ch. 13 'Heraklion'; times British"
    url: "https://s3-ap-southeast-2.amazonaws.com/awm-media/collection/RCDIG1070151/document/5519477.PDF"
  NZH:
    cite: "NZHistory, 'The Battle for Crete - The battle: days 1-3', Manatu Taonga (updated 3 Nov 2020); used for values shared with Maleme (same Luftwaffe, HQ and airlift)"
    url: "https://nzhistory.govt.nz/war/the-battle-for-crete/the-battle-day-1-3"
  WPH:
    cite: "Wikipedia, 'Battle of Heraklion' (search excerpt only)"
    url: "https://en.wikipedia.org/wiki/Battle_of_Heraklion"
  WHN:
    cite: "Warfare History Network, 'A Pyrrhic Parachute Victory in Crete' (search excerpt only)"
    url: "https://warfarehistorynetwork.com/article/a-pyrrhic-parachute-victory-in-crete/"

parameters:
  # AIR ---------------------------------------------------------------------
  air.att.ingress_loss: {dist: uniform, lo: 0.05, hi: 0.08, source: LONG13, confidence: high, note: "at least 15 of more than 240 troop-carriers shot down; twelve Bofors round the airfield plus 3-inch AA and pom-poms"}
  air.att.approach_loss: {dist: uniform, lo: 0.005, hi: 0.015, assumption: true}
  air.att.suppression: {dist: uniform, lo: 0.0, hi: 0.2, source: WPH, confidence: medium, note: "launched without direct air support, nearly an hour after the Luftwaffe raids had ended"}
  air.att.interdiction: {dist: uniform, lo: 0.1, hi: 0.3, assumption: true, note: "Luftwaffe over Crete by day, but not supporting this drop"}
  air.att.cas: {dist: uniform, lo: 1.0, hi: 1.1, source: WPH, assumption: true, note: "no direct air support"}
  # MASS --------------------------------------------------------------------
  mass.aircraft: {dist: fixed, value: 200, source: LONG13, confidence: medium, note: "more than 240 Ju 52 counted over two hours, enough to carry more than 2,000 men; 600 of FJR 1 stayed in Greece for lack of aircraft. 200 x 12 = 2,400. Was 120-180"}
  mass.capacity: {dist: fixed, value: 12, assumption: true}
  mass.dz_loss: {dist: uniform, lo: 0.45, hi: 0.70, source: WPH, assumption: true, confidence: low, note: "staggered drops over several hours onto defended positions"}
  mass.reserve_aircraft: {dist: fixed, value: 0, assumption: true, note: "all airborne reserves went to Maleme"}
  mass.reserve_capacity: {dist: fixed, value: 12, assumption: true}
  mass.reserve_dz: {dist: fixed, value: 0.0, assumption: true}
  mass.t_reserve: {dist: fixed, value: 30.0, assumption: true, note: "inactive (no reserve)"}
  mass.shock: {dist: fixed, value: 0, assumption: true, note: "0 as at Maleme: no surprise shock modelled for the Crete drops"}
  mass.shock_decay_h: {dist: fixed, value: 2.0, assumption: true, note: "inactive while mass.shock = 0"}
  mass.cornered: {dist: fixed, value: 1.0, assumption: true,
    note: "1 = ordinary force-ratio morale; not estimated, keeps 0.2.0 behaviour"}
  mass.ammo_out_h: {dist: fixed, value: 1000.0, assumption: true, note: "not binding: the attacker was resupplied (air-landing or ground link-up) or held out beyond the horizon"}
  # HOLD --------------------------------------------------------------------
  hold.strength: {dist: uniform, lo: 1400, hi: 2050, source: LONG13, confidence: high, note: "2nd Black Watch (867) on the airfield and heights, 2/4th Australian (550) on the Charlies above it, and the 2nd Leicesters (637) as airfield counterattack reserve; the rest of the 14th Brigade and the Greeks held the town. Was 1,500-3,000"}
  hold.quality: {dist: uniform, lo: 1.0, hi: 1.2, assumption: true, note: "regular British and Australian battalions plus Greek units"}
  hold.dug_in: {dist: fixed, value: 1.5, assumption: true}
  hold.base_hazard: {dist: uniform, lo: 0.0, hi: 0.01, assumption: true, note: "no withdrawal from the airfield sector"}
  hold.ammo_out_h: {dist: fixed, value: 1000.0, assumption: true, note: "no ammunition crisis reported"}
  hold.decision_h: {dist: fixed, value: 0.0, assumption: true, note: "0 = continuous: no evidence of a command-cycle withdrawal"}
  hold.comms_loss: {dist: fixed, value: 0.0, assumption: true}
  hold.fog: {dist: fixed, value: 0.0, assumption: true}
  hold.night_moves: {dist: fixed, value: 0, assumption: true}
  hold.move_delay_h: {dist: fixed, value: 0.0, assumption: true, note: "inactive without a command cycle"}
  hold.perimeter_frac: {dist: fixed, value: 0.0, assumption: true, note: "0 = no separate perimeter; all defenders on the field"}
  hold.perimeter_fire: {dist: fixed, value: 0.0, assumption: true, note: "0 = no perimeter fire"}
  # RESPONSE ----------------------------------------------------------------
  response.t_ca: {dist: uniform, lo: 1.0, hi: 1.5, source: LONG13, confidence: high, note: "at 18:15 Chappel sent the carrier platoon of the Leicesters and a platoon of the York and Lancasters toward Buttercup Field (cleared by 21:30). Was 14-20"}
  response.strength: {dist: uniform, lo: 60, hi: 150, source: LONG13, assumption: true, confidence: low, note: "a carrier platoon and an infantry platoon. Was 500-1000"}
  response.commit_h: {dist: uniform, lo: 8, hi: 14, assumption: true}
  response.withdraw_ratio: {dist: fixed, value: 2.0, assumption: true}
  response.t_ca2: {dist: uniform, lo: 14.0, hi: 17.0, source: LONG13, confidence: medium, note: "next morning the platoon of Germans on the eastern edge of the field was overcome by tanks"}
  response.strength2: {dist: uniform, lo: 150, hi: 300, source: LONG13, assumption: true, confidence: low, note: "tanks with infantry; size not given"}
  # DENIAL ------------------------------------------------------------------
  denial.obstacles0: {dist: fixed, value: 0.0, assumption: true}
  denial.t_fires: {dist: uniform, lo: 0.0, hi: 1.0, assumption: true, note: "defending artillery engaged the drop from the start (as at Maleme)"}
  denial.fire_intensity: {dist: uniform, lo: 0.4, hi: 0.8, assumption: true, note: "artillery and Bofors covering the airfield"}
  denial.crater_rate: {dist: uniform, lo: 0.0, hi: 0.02, assumption: true}
  denial.demolish_rate: {dist: uniform, lo: 0.05, hi: 0.15, assumption: true}
  # RISK --------------------------------------------------------------------
  risk.tolerance: {dist: uniform, lo: 0.25, hi: 0.40, source: NZH, assumption: true, note: "same value as Maleme: the same HQ (Student) decided the air-landings on Crete"}
  risk.land_contested: {dist: fixed, value: 0, source: NZH, assumption: true, note: "same as Maleme: transports landed only on a field in German hands"}
  risk.commit_lag_h: {dist: uniform, lo: 2.0, hi: 6.0, source: NZH, assumption: true, confidence: low, note: "same value as Maleme (same HQ in Athens)"}
  risk.commit_cycle_h: {dist: fixed, value: 0.0, assumption: true, note: "same value as Maleme (same HQ); replaced by risk.commit_daylight in 0.6.0"}
  risk.commit_daylight: {dist: fixed, value: 1, assumption: true, note: "same value as Maleme (same HQ in Athens)"}
  # CONTEXT (not swapped) ---------------------------------------------------
  ctx.aircraft: {dist: uniform, lo: 25, hi: 40, assumption: true, note: "Ju 52 per shuttle sortie"}
  ctx.troops_per_aircraft: {dist: fixed, value: 13, assumption: true}
  ctx.exploit_delay: {dist: uniform, lo: 3.0, hi: 8.0, source: NZH, assumption: true, note: "same value as Maleme (same airlift organisation)"}
  ctx.interval_h: {dist: fixed, value: 3.0, assumption: true}
  ctx.night_limited_air: {dist: fixed, value: 1, assumption: true, note: "1941 air power is essentially day-only"}
  ctx.wreck_obstacle: {dist: fixed, value: 0.004, assumption: true}
  # MECHANIC CONSTANTS (identical across the family) ------------------------
  mech.kill_rate: {dist: fixed, value: 0.01, assumption: true, note: "casualties per effective shooter-hour"}
  mech.ratio_coeff: {dist: fixed, value: 0.10, assumption: true}
  mech.casualty_coeff: {dist: fixed, value: 0.30, assumption: true}
  mech.ammo_hazard: {dist: fixed, value: 2.0, assumption: true}
  mech.go_width: {dist: fixed, value: 0.02, assumption: true,
    note: "logistic go/no-go rule only: spread of accepted risk around the tolerance, per wave or sortie"}
  mech.info_lag_h: {dist: fixed, value: 0.0, assumption: true,
    note: "delay between the true landing risk and the decision maker's estimate; 0 = perfect information"}
  mech.contested_risk: {dist: fixed, value: 0.35, assumption: true,
    note: "extra per-aircraft loss when landing on a contested field (only with risk.land_contested); set from Ypenburg 1940 accounts (WOH): of 12 Ju 52 in the first wave few crews or troops came out unscathed"}
  doctrine.hasty_defense: {dist: fixed, value: 1.2, assumption: true}
  doctrine.clear_rate: {dist: fixed, value: 0.15, assumption: true}

sides:
  DE:
    role: attacker
    air: {cas: $air.att.cas, suppress_enemy_fires: $air.att.suppression, interdiction: $air.att.interdiction,
          ingress_loss: $air.att.ingress_loss, approach_loss: $air.att.approach_loss,
          night_limited: $ctx.night_limited_air}
    doctrine: {risk_tolerance: $risk.tolerance, clear_rate: $doctrine.clear_rate,
               hasty_defense: $doctrine.hasty_defense, land_contested: $risk.land_contested}
  GB:
    role: defender
    air: {night_limited: $ctx.night_limited_air}
    doctrine: {demolish_rate: $denial.demolish_rate}

zones:
  airfield: {kind: airfield, control: GB, runway: {obstacles: $denial.obstacles0}}

units:
  heraklion_garrison:
    side: GB
    kind: infantry
    strength: "$hold.strength * (1 - $hold.perimeter_frac)"
    quality: $hold.quality
    dug_in: $hold.dug_in
    morale: {base_hazard: $hold.base_hazard, ammo_out_h: $hold.ammo_out_h,
             decision_h: $hold.decision_h, comms_loss: $hold.comms_loss, fog: $hold.fog,
             night_moves: $hold.night_moves, move_delay_h: $hold.move_delay_h}
    arrive: {t: 0.0, zone: airfield}
  fjr_1:
    side: DE
    kind: airborne_infantry
    morale: {on_break: disperse, ratio_scale: $mass.cornered, ammo_out_h: $mass.ammo_out_h}
    arrive: {t: 0.0, zone: airfield, mode: parachute, aircraft: $mass.aircraft,
             capacity: $mass.capacity, dz_loss: $mass.dz_loss,
             shock: $mass.shock, shock_decay_h: $mass.shock_decay_h}
  airborne_reserve:
    side: DE
    kind: parachute_infantry
    morale: {on_break: disperse, ratio_scale: $mass.cornered, ammo_out_h: $mass.ammo_out_h}
    arrive: {t: $mass.t_reserve, zone: airfield, mode: parachute, aircraft: $mass.reserve_aircraft,
             capacity: $mass.reserve_capacity, dz_loss: $mass.reserve_dz,
             shock: $mass.shock, shock_decay_h: $mass.shock_decay_h, only_if_present: true}
  gb_counterattack:
    side: GB
    kind: infantry
    strength: $response.strength
    morale: {commit_h: $response.commit_h, withdraw_ratio: $response.withdraw_ratio}
    arrive: {t: $response.t_ca, zone: airfield}
  gb_counterattack_2:
    side: GB
    kind: infantry
    strength: $response.strength2
    morale: {commit_h: $response.commit_h, withdraw_ratio: $response.withdraw_ratio}
    arrive: {t: $response.t_ca2, zone: airfield}
  gebirgsjaeger:
    side: DE
    kind: airlanded_infantry
    morale: {on_break: disperse, ratio_scale: $mass.cornered, ammo_out_h: $mass.ammo_out_h}

fires:
  - {id: perimeter_fire, side: GB, zone: airfield, active_from: 0.0, intensity: $hold.perimeter_fire}   # 0: no separate perimeter
  - {id: gb_artillery, side: GB, zone: airfield, active_from: $denial.t_fires,
     intensity: $denial.fire_intensity, crater_rate: $denial.crater_rate}

airlift:
  side: DE
  zone: airfield
  unit: gebirgsjaeger
  aircraft: $ctx.aircraft
  troops_per_aircraft: $ctx.troops_per_aircraft
  mode: shuttle
  interval_h: $ctx.interval_h
  first_after_control_h: $ctx.exploit_delay
  daylight_only: true
  wreck_obstacle: $ctx.wreck_obstacle
  contested_risk: $mech.contested_risk
  commit_lag_h: $risk.commit_lag_h
  commit_cycle_h: $risk.commit_cycle_h
  commit_daylight: $risk.commit_daylight

mechanics:
  # resolver: lanchester | crt. The CRT is ILLUSTRATIVE, not calibrated: at 1:1 it
  # costs the attacker ~6%/h against Lanchester's 1%/h, and its exchange ratio
  # grows roughly linearly with odds rather than with odds squared
  # (`battlelab resolvers`). Use it to test whether a conclusion depends on the
  # attrition model, never for magnitudes.
  combat: {resolver: lanchester, kill_rate: $mech.kill_rate, fire_weight_defend: 1.0, fire_weight_attack: 2.0}
  morale: {ratio_coeff: $mech.ratio_coeff, casualty_coeff: $mech.casualty_coeff, ammo_hazard: $mech.ammo_hazard}
  go_no_go: {rule: threshold, width: $mech.go_width, info_lag_h: $mech.info_lag_h}   # rule: threshold | logistic

outcome: {zone: airfield, airbridge_troops: 500}

factors:
  AIR: [air.att.ingress_loss, air.att.approach_loss, air.att.suppression, air.att.interdiction, air.att.cas]
  MASS: [mass.aircraft, mass.capacity, mass.dz_loss, mass.reserve_aircraft, mass.reserve_capacity,
         mass.reserve_dz, mass.t_reserve, mass.shock, mass.shock_decay_h,
         mass.cornered, mass.ammo_out_h]
  HOLD: [hold.strength, hold.quality, hold.dug_in, hold.base_hazard, hold.ammo_out_h,
         hold.perimeter_frac, hold.perimeter_fire]
  COMMAND: [hold.decision_h, hold.comms_loss, hold.fog, hold.night_moves, hold.move_delay_h]
  RESPONSE: [response.t_ca, response.strength, response.commit_h, response.withdraw_ratio,
             response.t_ca2, response.strength2]
  DENIAL: [denial.obstacles0, denial.t_fires, denial.fire_intensity, denial.crater_rate, denial.demolish_rate]
  RISK: [risk.tolerance, risk.land_contested, risk.commit_lag_h, risk.commit_cycle_h, risk.commit_daylight]

anchors:
  - {id: germans_never_take_field, metric: attacker_ever_controls, op: eq, value: false, source: WPH,
     note: "the Germans never took Heraklion airfield before the garrison was evacuated on 28/29 May"}
  - {id: no_airbridge, metric: airbridge, op: eq, value: false, source: WPH}
  - {id: no_landings, metric: transports_lost, op: eq, value: 0, source: WPH,
     note: "no transports landed at Heraklion"}
