id: ypenburg_1940
title: "Ypenburg airfield, The Hague, 10-11 May 1940"
family: airhead
description: >
  German air-landing at Ypenburg on the first day of the invasion of the
  Netherlands. The field was bombed at dawn, paratroops dropped around it and
  Ju 52s landed troops of Infanterie-Regiment 65 (22. Luftlande-Division) into
  the fire of the Grenadiers and their Landsverk armoured cars. Burning wrecks
  closed the runway to later waves, and Dutch counterattacks retook the field
  in the afternoon. A failure case for the airhead family: it stresses the
  runway, landing-under-fire and airlift mechanics.
  Sourcing is thin (search excerpts of the sources below, not full texts), so
  most values are flagged assumptions with low confidence.
clock:
  h_hour_local: 4.25        # bombing of the field ~04:15, drops immediately after
  dt_h: 0.25
  horizon_h: 48

sources:
  NIMH:
    cite: "Nederlands Instituut voor Militaire Historie, 'De slag om de Residentie' and 'Vliegvelden in oorlogstijd: Ypenburg'"
    url: "https://www.nimh.nl/militaire-geschiedenis-van-nederland/historische-overzichten/vliegvelden-in-oorlogstijd/ypenburg"
  WOH:
    cite: "War over Holland - May 1940: the Dutch struggle, 'Ypenburg' (10 May, airlandings around The Hague); read in full in 0.5.0"
    url: "https://waroverholland.nl/10-may/airlanding/ypenburg"
  BRONGERS:
    cite: "E.H. Brongers, 'The Battle for The Hague 1940: The First Great Airborne Operation in History', Aspekt, 2004"
    note: "cited via WOH and secondary summaries, not read directly"
  WPH:
    cite: "Wikipedia, 'Battle for The Hague' (EN) and 'Slag om Den Haag' (NL)"
    url: "https://en.wikipedia.org/wiki/Battle_for_The_Hague"

parameters:
  # AIR ---------------------------------------------------------------------
  air.att.ingress_loss: {dist: uniform, lo: 0.04, hi: 0.08, source: WOH, confidence: medium, note: "three loaded transports of the drop Gruppe crashed from direct AA hits on the way in (about 3 of 53, 0.06); most of the 26 that did not return were lost after the drop"}
  air.att.approach_loss: {dist: uniform, lo: 0.05, hi: 0.15, source: WOH, assumption: true, confidence: medium, note: "AA around the field (6 x Vickers 7.5 cm, 12 x Oerlikon 2 cm, 20 heavy MGs) and the 2 cm platoons at Delft were the main threat to the transports; three Landsverk armoured cars also fired"}
  air.att.suppression: {dist: uniform, lo: 0.2, hi: 0.5, source: WOH, assumption: true,
    note: "dawn bombing of the defences; several positions survived and fired on the first wave"}
  air.att.interdiction: {dist: uniform, lo: 0.1, hi: 0.3, assumption: true}
  air.att.cas: {dist: uniform, lo: 1.1, hi: 1.3, assumption: true}
  # MASS --------------------------------------------------------------------
  mass.aircraft: {dist: fixed, value: 40, source: WOH, confidence: medium, note: "I./FJR 2 less its 3rd company, about 480 men, flown by IV./KGzbV.1 (53 aircraft, one squadron dropping the 3rd company over Ockenburg): about 40 over Ypenburg. SOURCED in 0.5.0 (was 13-26, an assumption revised after an anchor run)"}
  mass.capacity: {dist: fixed, value: 12, assumption: true}
  mass.dz_loss: {dist: uniform, lo: 0.50, hi: 0.75, source: WOH, confidence: medium, note: "badly scattered between Overschie, Rijswijk, Delft, Nootdorp and Pijnacker; at least half could not take part because of misdrops; the fight began with a few dozen, growing to a few hundred"}
  mass.reserve_aircraft: {dist: fixed, value: 0, assumption: true, note: "no second drop at Ypenburg modelled"}
  mass.reserve_capacity: {dist: fixed, value: 12, assumption: true}
  mass.reserve_dz: {dist: fixed, value: 0.0, assumption: true}
  mass.t_reserve: {dist: fixed, value: 30.0, assumption: true}
  mass.shock: {dist: uniform, lo: 0.3, hi: 0.7, source: WOH, assumption: true, confidence: low,
    note: "the first large airborne assault in history, after dawn bombing; defenders' effectiveness in the landing zone drops at first. Added for issue #3 (missing mechanism), prior set before the anchor run"}
  mass.shock_decay_h: {dist: uniform, lo: 1.0, hi: 4.0, assumption: true,
    note: "e-folding time of the surprise; the Dutch had reorganised and counterattacked within hours"}
  mass.cornered: {dist: uniform, lo: 0.2, hi: 0.6, source: WOH, assumption: true, confidence: low,
    note: "scales the force-ratio morale term of the airborne units: surrounded, with nowhere to withdraw to, they held out in pockets until killed or captured (WOH). Added for issue #3 after traces showed the paratroops 'withdrawing' at 5:1 within hours; prior set before the anchor run with it"}
  mass.ammo_out_h: {dist: uniform, lo: 6.0, hi: 14.0, assumption: true, confidence: low,
    note: "hours of fighting until the airborne troops run dry: they landed with what they carried, weapons containers were scattered, and nothing came in once the transport stream stopped. Added for issue #13 (the Dutch retook both fields the same day); prior set before the anchor run"}
  # HOLD --------------------------------------------------------------------
  hold.strength: {dist: uniform, lo: 250, hi: 450, source: WOH, assumption: true, confidence: low, note: "III Bn Regiment Grenadiers: one company and the heavy-MG company on the NW and SW sides of the field (plus two platoons of Landsverk armoured cars), a second company in an outer NW screen, a third in reserve. No headcount in any source; counts the company, the MG company and the armoured-car crews at the field (about 150 a company). Was 300-700"}
  hold.quality: {dist: uniform, lo: 0.8, hi: 1.0, assumption: true,
    note: "conscript army without combat experience, but well sited and alert"}
  hold.dug_in: {dist: fixed, value: 1.3, assumption: true}
  hold.base_hazard: {dist: uniform, lo: 0.01, hi: 0.04, assumption: true}
  hold.ammo_out_h: {dist: fixed, value: 1000.0, assumption: true, note: "no ammunition crisis reported"}
  hold.decision_h: {dist: fixed, value: 0.0, assumption: true, note: "0 = continuous; no command-cycle evidence"}
  hold.comms_loss: {dist: fixed, value: 0.0, assumption: true}
  hold.fog: {dist: fixed, value: 0.0, assumption: true}
  hold.night_moves: {dist: fixed, value: 0, assumption: true}
  hold.move_delay_h: {dist: fixed, value: 0.0, assumption: true, note: "0 = orders executed at once (inactive without a command cycle)"}
  hold.perimeter_frac: {dist: fixed, value: 0.0, assumption: true,
    note: "share of defenders in NW/SW edge positions (zone `perimeter`) instead of on the field. Tried 0.2-0.5 with perimeter_fire 0.1-0.3 (issue #3 follow-up): sole German control of the field rose only 0.21 -> 0.26, and the joint anchor share fell 0.54 -> 0.46 (the extra fire makes the first wave abort more often: first_wave_lands_under_fire 0.76 -> 0.65). Not adopted; the zone and fire stay in the file, inactive, for the sourcing pass (#4)"}
  hold.perimeter_fire: {dist: fixed, value: 0.0, assumption: true, note: "fire from the perimeter positions onto the field while held; inactive (see hold.perimeter_frac)"}
  # RESPONSE ----------------------------------------------------------------
  response.t_ca: {dist: uniform, lo: 5.5, hi: 6.0, source: WOH, confidence: high, note: "first counterattack about 10:00 (WOH, NIMH): one company of recruits over the Hoornbrug and a Grenadier company toward Johannahoeve; it ended in a stand-off"}
  response.strength: {dist: uniform, lo: 300, hi: 500, source: WOH, assumption: true, confidence: low, note: "two Grenadier companies and 1.5 recruit companies (snippet) at about 150 a company; was 400-900"}
  response.commit_h: {dist: uniform, lo: 8, hi: 14, assumption: true}
  response.withdraw_ratio: {dist: fixed, value: 2.0, assumption: true}
  response.t_ca2: {dist: uniform, lo: 7.5, hi: 10.0, source: WOH, confidence: medium, note: "after a half-hour truce, the decisive artillery-supported attack (three small companies) in the early afternoon; the German defence collapsed within minutes and the field was Dutch again before the RAF raid at 15:10"}
  response.strength2: {dist: uniform, lo: 300, hi: 500, source: WOH, assumption: true, confidence: low, note: "three small companies (two east of the highway, one west); was 400-800"}
  # DENIAL ------------------------------------------------------------------
  denial.obstacles0: {dist: fixed, value: 0.0, assumption: true, note: "no deliberate obstruction reported"}
  denial.t_fires: {dist: uniform, lo: 5.5, hi: 8.0, source: WOH, confidence: medium, note: "three batteries of light field artillery (7.5 cm) firing direct, and guns from Naaldwijk, from about 10:00 in support of the counterattacks"}
  denial.fire_intensity: {dist: uniform, lo: 0.3, hi: 0.6, assumption: true}
  denial.crater_rate: {dist: uniform, lo: 0.0, hi: 0.03, assumption: true}
  denial.demolish_rate: {dist: uniform, lo: 0.0, hi: 0.05, assumption: true}
  # RISK --------------------------------------------------------------------
  risk.tolerance: {dist: uniform, lo: 0.40, hi: 0.70, source: WOH, assumption: true,
    note: "first wave landed into the defenders' fire on schedule; later waves turned away only when wrecks blocked the strip"}
  risk.land_contested: {dist: fixed, value: 1, source: WOH, confidence: medium,
    note: "air-landing timed to follow the drop, not the capture of the field"}
  risk.commit_lag_h: {dist: fixed, value: 0.0, assumption: true, note: "0 = no commitment delay (only used in shuttle mode)"}
  risk.commit_cycle_h: {dist: fixed, value: 0.0, assumption: true, note: "0 = no decision cycle (only used in shuttle mode)"}
  # CONTEXT (not swapped) ---------------------------------------------------
  ctx.aircraft: {dist: fixed, value: 12, source: WOH, confidence: medium,
    note: "first twelve Ju 52 with the first air-landing infantry"}
  ctx.troops_per_aircraft: {dist: uniform, lo: 12, hi: 16, source: WOH, confidence: medium,
    note: "about 150-200 men on board the first wave"}
  ctx.wave1_t: {dist: uniform, lo: 0.9, hi: 1.1, source: WOH, confidence: high, note: "the first twelve Ju 52 (KGrzbV.12) landed at about 05:15"}
  ctx.wave2_t: {dist: uniform, lo: 1.15, hi: 1.4, source: WOH, confidence: high, note: "wave 2 landed about fifteen minutes after the first and shared its fate. Was 1.5-2.5"}
  ctx.wave3_t: {dist: uniform, lo: 1.5, hi: 3.0, source: WOH, assumption: true, note: "no time in any source; wave 3 came after wave 2 and mostly diverted because of the burning wrecks; a fourth wave diverted to Ockenburg and elsewhere. Was 3.0-4.5"}
  ctx.loiter_h: {dist: fixed, value: 0.5, assumption: true, note: "Ju 52 diverted to other fields and beaches"}
  ctx.night_limited_air: {dist: fixed, value: 1, assumption: true, note: "1940 air power is essentially day-only"}
  ctx.wreck_obstacle: {dist: uniform, lo: 0.03, hi: 0.06, source: WOH, assumption: true,
    note: "fourteen burning aircraft closed the strip; a Ju 52 wreck on a grass field blocks a lot of it"}
  # MECHANIC CONSTANTS (identical across the family) ------------------------
  mech.kill_rate: {dist: fixed, value: 0.01, assumption: true, note: "casualties per effective shooter-hour"}
  mech.ratio_coeff: {dist: fixed, value: 0.10, assumption: true}
  mech.casualty_coeff: {dist: fixed, value: 0.30, assumption: true}
  mech.ammo_hazard: {dist: fixed, value: 2.0, assumption: true}
  mech.go_width: {dist: fixed, value: 0.02, assumption: true,
    note: "logistic go/no-go rule only: spread of accepted risk around the tolerance, per wave or sortie"}
  mech.info_lag_h: {dist: fixed, value: 0.0, assumption: true,
    note: "delay between the true landing risk and the decision maker's estimate; 0 = perfect information"}
  mech.contested_risk: {dist: fixed, value: 0.35, source: WOH, assumption: true,
    note: "of the 150-200 men of the first wave only few came out unscathed; value shared across the family"}
  doctrine.hasty_defense: {dist: fixed, value: 1.2, assumption: true}
  doctrine.clear_rate: {dist: fixed, value: 0.15, assumption: true}

sides:
  DE:
    role: attacker
    air: {cas: $air.att.cas, suppress_enemy_fires: $air.att.suppression, interdiction: $air.att.interdiction,
          ingress_loss: $air.att.ingress_loss, approach_loss: $air.att.approach_loss,
          night_limited: $ctx.night_limited_air}
    doctrine: {risk_tolerance: $risk.tolerance, clear_rate: $doctrine.clear_rate,
               hasty_defense: $doctrine.hasty_defense, land_contested: $risk.land_contested}
  NL:
    role: defender
    air: {night_limited: $ctx.night_limited_air}
    doctrine: {demolish_rate: $denial.demolish_rate}

zones:
  airfield: {kind: airfield, control: NL, runway: {obstacles: $denial.obstacles0}}
  perimeter: {kind: open, control: NL}        # NW/SW edge positions overlooking the field

units:
  grenadiers_iii_bn:
    side: NL
    kind: infantry
    strength: "$hold.strength * (1 - $hold.perimeter_frac)"
    quality: $hold.quality
    dug_in: $hold.dug_in
    morale: {base_hazard: $hold.base_hazard, ammo_out_h: $hold.ammo_out_h,
             decision_h: $hold.decision_h, comms_loss: $hold.comms_loss, fog: $hold.fog,
             night_moves: $hold.night_moves, move_delay_h: $hold.move_delay_h}
    arrive: {t: 0.0, zone: airfield}
  grenadiers_perimeter:
    side: NL
    kind: infantry
    strength: "$hold.strength * $hold.perimeter_frac"
    quality: $hold.quality
    dug_in: $hold.dug_in
    morale: {base_hazard: $hold.base_hazard, ammo_out_h: $hold.ammo_out_h}
    arrive: {t: 0.0, zone: perimeter}
  fallschirmjaeger:
    side: DE
    kind: parachute_infantry
    morale: {on_break: disperse, ratio_scale: $mass.cornered, ammo_out_h: $mass.ammo_out_h}
    arrive: {t: 0.0, zone: airfield, mode: parachute, aircraft: $mass.aircraft,
             capacity: $mass.capacity, dz_loss: $mass.dz_loss,
             shock: $mass.shock, shock_decay_h: $mass.shock_decay_h}
  airborne_reserve:
    side: DE
    kind: parachute_infantry
    morale: {on_break: disperse, ratio_scale: $mass.cornered, ammo_out_h: $mass.ammo_out_h}
    arrive: {t: $mass.t_reserve, zone: airfield, mode: parachute, aircraft: $mass.reserve_aircraft,
             capacity: $mass.reserve_capacity, dz_loss: $mass.reserve_dz,
             shock: $mass.shock, shock_decay_h: $mass.shock_decay_h, only_if_present: true}
  nl_counterattack:
    side: NL
    kind: infantry
    strength: $response.strength
    morale: {commit_h: $response.commit_h, withdraw_ratio: $response.withdraw_ratio}
    arrive: {t: $response.t_ca, zone: airfield}
  nl_counterattack_2:
    side: NL
    kind: infantry
    strength: $response.strength2
    morale: {commit_h: $response.commit_h, withdraw_ratio: $response.withdraw_ratio}
    arrive: {t: $response.t_ca2, zone: airfield}
  ir_65:
    side: DE
    kind: airlanded_infantry
    morale: {on_break: disperse, ratio_scale: $mass.cornered, ammo_out_h: $mass.ammo_out_h}

fires:
  - {id: nl_perimeter_fire, side: NL, zone: airfield, from_zone: perimeter, active_from: 0.0,
     intensity: $hold.perimeter_fire}
  - {id: nl_artillery, side: NL, zone: airfield, active_from: $denial.t_fires,
     intensity: $denial.fire_intensity, crater_rate: $denial.crater_rate}

airlift:
  side: DE
  zone: airfield
  unit: ir_65
  aircraft: $ctx.aircraft
  troops_per_aircraft: $ctx.troops_per_aircraft
  mode: waves
  waves: [$ctx.wave1_t, $ctx.wave2_t, $ctx.wave3_t]
  loiter_h: $ctx.loiter_h
  wreck_obstacle: $ctx.wreck_obstacle
  contested_risk: $mech.contested_risk
  commit_lag_h: $risk.commit_lag_h
  commit_cycle_h: $risk.commit_cycle_h

mechanics:
  # resolver: lanchester | crt. The CRT is ILLUSTRATIVE, not calibrated: at 1:1 it
  # costs the attacker ~6%/h against Lanchester's 1%/h, and its exchange ratio
  # grows roughly linearly with odds rather than with odds squared
  # (`battlelab resolvers`). Use it to test whether a conclusion depends on the
  # attrition model, never for magnitudes.
  combat: {resolver: lanchester, kill_rate: $mech.kill_rate, fire_weight_defend: 1.0, fire_weight_attack: 2.0}
  morale: {ratio_coeff: $mech.ratio_coeff, casualty_coeff: $mech.casualty_coeff, ammo_hazard: $mech.ammo_hazard}
  go_no_go: {rule: threshold, width: $mech.go_width, info_lag_h: $mech.info_lag_h}   # rule: threshold | logistic

outcome: {zone: airfield, airbridge_troops: 500}

factors:
  AIR: [air.att.ingress_loss, air.att.approach_loss, air.att.suppression, air.att.interdiction, air.att.cas]
  MASS: [mass.aircraft, mass.capacity, mass.dz_loss, mass.reserve_aircraft, mass.reserve_capacity,
         mass.reserve_dz, mass.t_reserve, mass.shock, mass.shock_decay_h,
         mass.cornered, mass.ammo_out_h]
  HOLD: [hold.strength, hold.quality, hold.dug_in, hold.base_hazard, hold.ammo_out_h,
         hold.perimeter_frac, hold.perimeter_fire]
  COMMAND: [hold.decision_h, hold.comms_loss, hold.fog, hold.night_moves, hold.move_delay_h]
  RESPONSE: [response.t_ca, response.strength, response.commit_h, response.withdraw_ratio,
             response.t_ca2, response.strength2]
  DENIAL: [denial.obstacles0, denial.t_fires, denial.fire_intensity, denial.crater_rate, denial.demolish_rate]
  RISK: [risk.tolerance, risk.land_contested, risk.commit_lag_h, risk.commit_cycle_h]

anchors:
  - {id: germans_hold_on_field, metric: attacker_hours_on_field, op: ge, value: 3.0, source: WOH,
     note: "German troops held the airbase buildings for hours until the counterattack forced them out, while Dutch positions kept firing. REVISED in 0.3.0 from `attacker_ever_controls eq true` (sole control of the one-zone field), which the source does not claim; see CHANGELOG"}
  - {id: first_wave_lands_under_fire, metric: t_first_landing, op: le, value: 1.5, source: WOH,
     note: "the first twelve Ju 52 landed straight into the defenders' fire"}
  - {id: heavy_transport_losses, metric: transports_lost, op: ge, value: 8, source: WOH,
     note: "fourteen burning aircraft on the landing strip"}
  - {id: runway_blocked, metric: runway_end, op: lt, value: 0.6, source: WOH,
     note: "Ypenburg rendered unusable by the many wrecks"}
  - {id: no_airbridge, metric: airbridge, op: eq, value: false, source: WOH}
  - {id: germans_lose_field, metric: attacker_holds_end, op: eq, value: false, source: WOH,
     note: "by evening every German near Ypenburg had been killed or captured"}
