id: maleme_1941
title: "Maleme airfield, Crete, 20-22 May 1941"
family: airhead
clock:
  h_hour_local: 8.0         # gliders and paratroops arrive shortly after 08:00
  dt_h: 0.25
  horizon_h: 48

sources:
  NZH:
    cite: "NZHistory, 'The Battle for Crete - The battle: days 1-3', Manatu Taonga (updated 3 Nov 2020)"
    url: "https://nzhistory.govt.nz/war/the-battle-for-crete/the-battle-day-1-3"
  W2W:
    cite: "WW2Wrecks, 'Crete 1941: Hill 107 and Tavronitis Bridge, the turning point of the Battle'"
    url: "https://www.ww2wrecks.com/portfolio/crete-1941-hill-107-and-tavronitis-bridge-the-turning-point-of-the-battle/"

parameters:
  # AIR ---------------------------------------------------------------------
  air.att.ingress_loss: {dist: uniform, lo: 0.01, hi: 0.04, assumption: true,
    note: "Luftwaffe air superiority; some AA at Maleme"}
  air.att.approach_loss: {dist: uniform, lo: 0.005, hi: 0.015, assumption: true}
  air.att.suppression: {dist: uniform, lo: 0.4, hi: 0.7, source: NZH, assumption: true,
    note: "Luftwaffe pounded NZ positions around the airfield"}
  air.att.interdiction: {dist: uniform, lo: 0.3, hi: 0.6, source: NZH, confidence: low,
    note: "counterattack had to succeed before daylight exposed it to air attack"}
  air.att.cas: {dist: uniform, lo: 1.2, hi: 1.4, assumption: true}
  # MASS --------------------------------------------------------------------
  mass.aircraft: {dist: fixed, value: 150, assumption: true,
    note: "~50 gliders at Maleme plus the Sturmregiment's parachute battalions; round number"}
  mass.capacity: {dist: fixed, value: 12, assumption: true}
  mass.dz_loss: {dist: uniform, lo: 0.40, hi: 0.60, source: W2W, confidence: medium,
    note: "III Bn lost ~400 of 600 on day 1; paratroops landing on NZ positions were 'cut to pieces' (NZH)"}
  mass.reserve_aircraft: {dist: fixed, value: 33, source: NZH, assumption: true,
    note: "all remaining airborne reserves dropped at Maleme on 21 May; ~400 men"}
  mass.reserve_capacity: {dist: fixed, value: 12, assumption: true}
  mass.reserve_dz: {dist: uniform, lo: 0.1, hi: 0.3, assumption: true}
  mass.t_reserve: {dist: uniform, lo: 29.0, hi: 32.0, source: NZH, assumption: true,
    note: "21 May, afternoon"}
  mass.shock: {dist: fixed, value: 0, assumption: true,
    note: "not estimated: 0 keeps 0.2.0 behaviour; NZ positions were alert after the preceding bombing"}
  mass.shock_decay_h: {dist: fixed, value: 2.0, assumption: true, note: "inactive while mass.shock = 0"}
  mass.cornered: {dist: fixed, value: 1.0, assumption: true,
    note: "1 = ordinary force-ratio morale; not estimated, keeps 0.2.0 behaviour"}
  # HOLD --------------------------------------------------------------------
  hold.strength: {dist: uniform, lo: 500, hi: 650, assumption: true,
    note: "22nd NZ Battalion plus attached elements around the airfield and Point 107"}
  hold.quality: {dist: uniform, lo: 0.9, hi: 1.1, assumption: true}
  hold.dug_in: {dist: fixed, value: 1.5, assumption: true}
  hold.base_hazard: {dist: uniform, lo: 0.005, hi: 0.03, source: NZH, confidence: medium,
    note: "lost contact with forward companies, reinforcement refused, pulled back from Point 107 overnight"}
  hold.ammo_out_h: {dist: fixed, value: 1000.0, assumption: true, note: "no ammunition crisis reported"}
  hold.decision_h: {dist: uniform, lo: 2.0, hi: 6.0, assumption: true,
    note: "battalion HQ decision cycle; runners and failing wireless to forward companies (NZH)"}
  hold.comms_loss: {dist: uniform, lo: 0.4, hi: 0.8, source: NZH, confidence: medium,
    note: "22nd Bn commander lost contact with his forward companies on 20 May"}
  hold.fog: {dist: uniform, lo: 0.3, hi: 0.6, source: NZH, assumption: true,
    note: "without reports the commander assumed the forward companies were lost; they were largely intact"}
  hold.night_moves: {dist: fixed, value: 1, source: NZH, assumption: true,
    note: "withdrawal from Point 107 carried out overnight 20/21 May, under daytime Luftwaffe air superiority"}
  hold.move_delay_h: {dist: fixed, value: 0.0, assumption: true,
    note: "0 = the 22nd Bn pulls out as soon as it is dark. Tried 1-5 h (issue #5): t_control spreads out (p10/50/90 12.5/14.1/19.5 h instead of 12/12/14.8) but the joint anchor share falls 0.68 -> 0.54, because delayed orders that run past dawn wait a whole day. Not adopted without evidence on how long the withdrawal took"}
  # RESPONSE ----------------------------------------------------------------
  response.t_ca: {dist: uniform, lo: 38.0, hi: 46.0, source: NZH, confidence: medium,
    note: "night 21/22 May, delayed four hours; reached the airfield edge at dawn"}
  response.strength: {dist: uniform, lo: 900, hi: 1300, source: NZH, assumption: true,
    note: "20th and 28th (Maori) Battalions"}
  response.commit_h: {dist: uniform, lo: 8, hi: 14, assumption: true}
  response.withdraw_ratio: {dist: fixed, value: 2.0, assumption: true}
  # DENIAL ------------------------------------------------------------------
  denial.obstacles0: {dist: fixed, value: 0.0, assumption: true}
  denial.t_fires: {dist: uniform, lo: 0.0, hi: 1.0, source: NZH, confidence: medium,
    note: "the airfield was still under artillery fire when the transports landed"}
  denial.fire_intensity: {dist: uniform, lo: 0.3, hi: 0.6, assumption: true}
  denial.crater_rate: {dist: uniform, lo: 0.0, hi: 0.02, assumption: true}
  denial.demolish_rate: {dist: uniform, lo: 0.05, hi: 0.15, assumption: true}
  # RISK --------------------------------------------------------------------
  risk.tolerance: {dist: uniform, lo: 0.25, hi: 0.40, source: NZH, assumption: true,
    note: "airfield littered with wrecked aircraft, but enough troops landed to tip the balance"}
  risk.land_contested: {dist: fixed, value: 0, source: NZH, assumption: true,
    note: "Student waited for the field: transports landed only after the NZ withdrawal"}
  risk.commit_lag_h: {dist: uniform, lo: 2.0, hi: 6.0, source: NZH, assumption: true, confidence: low,
    note: "reports from Maleme reached Student's HQ in Athens late and incompletely. Added for issue #5 (first landings at dawn instead of the afternoon of 21 May); prior set before the anchor run"}
  risk.commit_cycle_h: {dist: uniform, lo: 6.0, hi: 12.0, assumption: true, confidence: low,
    note: "HQ commits the air-landing force only at its decision points (a test landing on the morning of 21 May preceded the commitment)"}
  # CONTEXT (not swapped) ---------------------------------------------------
  ctx.aircraft: {dist: uniform, lo: 25, hi: 40, assumption: true, note: "Ju 52 per shuttle sortie"}
  ctx.troops_per_aircraft: {dist: fixed, value: 13, assumption: true}
  ctx.exploit_delay: {dist: uniform, lo: 3.0, hi: 8.0, source: NZH, assumption: true,
    note: "Student committed reserves to Maleme once progress there was clear"}
  ctx.interval_h: {dist: fixed, value: 3.0, assumption: true}
  ctx.night_limited_air: {dist: fixed, value: 1, assumption: true, note: "1941 air power is essentially day-only"}
  ctx.wreck_obstacle: {dist: fixed, value: 0.004, assumption: true}
  # MECHANIC CONSTANTS (identical across the family) ------------------------
  mech.kill_rate: {dist: fixed, value: 0.01, assumption: true, note: "casualties per effective shooter-hour"}
  mech.ratio_coeff: {dist: fixed, value: 0.10, assumption: true}
  mech.casualty_coeff: {dist: fixed, value: 0.30, assumption: true}
  mech.ammo_hazard: {dist: fixed, value: 2.0, assumption: true}
  mech.go_width: {dist: fixed, value: 0.02, assumption: true,
    note: "logistic go/no-go rule only: spread of accepted risk around the tolerance, per wave or sortie"}
  mech.info_lag_h: {dist: fixed, value: 0.0, assumption: true,
    note: "delay between the true landing risk and the decision maker's estimate; 0 = perfect information"}
  mech.contested_risk: {dist: fixed, value: 0.35, assumption: true,
    note: "extra per-aircraft loss when landing on a contested field (only with risk.land_contested); set from Ypenburg 1940 accounts (WOH): of 12 Ju 52 in the first wave few crews or troops came out unscathed"}
  doctrine.hasty_defense: {dist: fixed, value: 1.2, assumption: true}
  doctrine.clear_rate: {dist: fixed, value: 0.15, assumption: true}

sides:
  DE:
    role: attacker
    air: {cas: $air.att.cas, suppress_enemy_fires: $air.att.suppression, interdiction: $air.att.interdiction,
          ingress_loss: $air.att.ingress_loss, approach_loss: $air.att.approach_loss,
          night_limited: $ctx.night_limited_air}
    doctrine: {risk_tolerance: $risk.tolerance, clear_rate: $doctrine.clear_rate,
               hasty_defense: $doctrine.hasty_defense, land_contested: $risk.land_contested}
  NZ:
    role: defender
    air: {night_limited: $ctx.night_limited_air}
    doctrine: {demolish_rate: $denial.demolish_rate}

zones:
  airfield: {kind: airfield, control: NZ, runway: {obstacles: $denial.obstacles0}}

units:
  nz_22_bn:
    side: NZ
    kind: infantry
    strength: $hold.strength
    quality: $hold.quality
    dug_in: $hold.dug_in
    morale: {base_hazard: $hold.base_hazard, ammo_out_h: $hold.ammo_out_h,
             decision_h: $hold.decision_h, comms_loss: $hold.comms_loss, fog: $hold.fog,
             night_moves: $hold.night_moves, move_delay_h: $hold.move_delay_h}
    arrive: {t: 0.0, zone: airfield}
  sturmregiment:
    side: DE
    kind: airborne_infantry
    morale: {on_break: disperse, ratio_scale: $mass.cornered}
    arrive: {t: 0.0, zone: airfield, mode: parachute, aircraft: $mass.aircraft,
             capacity: $mass.capacity, dz_loss: $mass.dz_loss,
             shock: $mass.shock, shock_decay_h: $mass.shock_decay_h}
  airborne_reserve:
    side: DE
    kind: parachute_infantry
    morale: {on_break: disperse, ratio_scale: $mass.cornered}
    arrive: {t: $mass.t_reserve, zone: airfield, mode: parachute, aircraft: $mass.reserve_aircraft,
             capacity: $mass.reserve_capacity, dz_loss: $mass.reserve_dz,
             shock: $mass.shock, shock_decay_h: $mass.shock_decay_h, only_if_present: true}
  nz_counterattack:
    side: NZ
    kind: infantry
    strength: $response.strength
    morale: {commit_h: $response.commit_h, withdraw_ratio: $response.withdraw_ratio}
    arrive: {t: $response.t_ca, zone: airfield}
  gebirgsjaeger:
    side: DE
    kind: airlanded_infantry
    morale: {on_break: disperse, ratio_scale: $mass.cornered}

fires:
  - {id: nz_artillery, side: NZ, zone: airfield, active_from: $denial.t_fires,
     intensity: $denial.fire_intensity, crater_rate: $denial.crater_rate}

airlift:
  side: DE
  zone: airfield
  unit: gebirgsjaeger
  aircraft: $ctx.aircraft
  troops_per_aircraft: $ctx.troops_per_aircraft
  mode: shuttle
  interval_h: $ctx.interval_h
  first_after_control_h: $ctx.exploit_delay
  daylight_only: true
  wreck_obstacle: $ctx.wreck_obstacle
  contested_risk: $mech.contested_risk
  commit_lag_h: $risk.commit_lag_h
  commit_cycle_h: $risk.commit_cycle_h

mechanics:
  # resolver: lanchester | crt. The CRT is ILLUSTRATIVE, not calibrated: at 1:1 it
  # costs the attacker ~6%/h against Lanchester's 1%/h, and its exchange ratio
  # grows roughly linearly with odds rather than with odds squared
  # (`battlelab resolvers`). Use it to test whether a conclusion depends on the
  # attrition model, never for magnitudes.
  combat: {resolver: lanchester, kill_rate: $mech.kill_rate, fire_weight_defend: 1.0, fire_weight_attack: 2.0}
  morale: {ratio_coeff: $mech.ratio_coeff, casualty_coeff: $mech.casualty_coeff, ammo_hazard: $mech.ammo_hazard}
  go_no_go: {rule: threshold, width: $mech.go_width, info_lag_h: $mech.info_lag_h}   # rule: threshold | logistic

outcome: {zone: airfield, airbridge_troops: 500}

factors:
  AIR: [air.att.ingress_loss, air.att.approach_loss, air.att.suppression, air.att.interdiction, air.att.cas]
  MASS: [mass.aircraft, mass.capacity, mass.dz_loss, mass.reserve_aircraft, mass.reserve_capacity,
         mass.reserve_dz, mass.t_reserve, mass.shock, mass.shock_decay_h,
         mass.cornered]
  HOLD: [hold.strength, hold.quality, hold.dug_in, hold.base_hazard, hold.ammo_out_h,
         hold.decision_h, hold.comms_loss, hold.fog, hold.night_moves,
         hold.move_delay_h]
  RESPONSE: [response.t_ca, response.strength, response.commit_h, response.withdraw_ratio]
  DENIAL: [denial.obstacles0, denial.t_fires, denial.fire_intensity, denial.crater_rate, denial.demolish_rate]
  RISK: [risk.tolerance, risk.land_contested, risk.commit_lag_h, risk.commit_cycle_h]

anchors:
  - {id: nz_leave_field_day1, metric: t_control, op: between, value: [4.0, 24.0], source: NZH,
     note: "22nd Bn pulled back from Point 107 during the night of 20/21 May"}
  - {id: landings_begin_day2_afternoon, metric: t_first_landing, op: between, value: [28.0, 34.0], source: NZH,
     note: "first transports landed on the afternoon of 21 May (12:00-18:00 = H+28 to H+34). TIGHTENED in 0.3.0 from [20, 40] (any time on day 2), see CHANGELOG and issue #5"}
  - {id: airbridge, metric: airbridge, op: eq, value: true, source: NZH}
  - {id: counterattack_fails, metric: defender_retakes, op: eq, value: false, source: NZH}
