[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battlelab"
version = "0.1.0"
description = "Monte Carlo framework for historical battle analysis, with a Command: Modern Operations backend"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyyaml>=6.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
battlelab = "battlelab.cli:main"

[tool.setuptools.packages.find]
include = ["battlelab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
