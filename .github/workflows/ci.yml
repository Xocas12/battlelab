name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Lua 5.3
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.3
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check battlelab tests
      - name: Mypy
        run: mypy battlelab
      - name: Lint scenarios
        run: battlelab lint scenarios/*.yaml
      - name: Tests
        run: python -m pytest -q
      - name: Lua harness vs mock CMO API
        working-directory: cmo
        run: |
          mkdir -p "$RUNNER_TEMP/bl_io" "$RUNNER_TEMP/bl_noio"
          lua5.3 tests/test_harness.lua lua "$RUNNER_TEMP/bl_io" -
          lua5.3 tests/test_harness.lua lua "$RUNNER_TEMP/bl_noio" - --no-io
          lua5.3 tests/test_probe.lua lua "$RUNNER_TEMP/bl_io" --write
          mkdir -p "$RUNNER_TEMP/bl_build"
          lua5.3 tests/test_build.lua lua "$RUNNER_TEMP/bl_build" "$PWD/pilot/bl_design.lua"
